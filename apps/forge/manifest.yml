# Atlassian Forge manifest for portfolio-lint.
# Replace app.id after running `npx forge register` (see README.md).
modules:
  jira:globalPage:
    - key: portfolio-lint-global
      resource: global-page
      resolver:
        function: resolver
      render: native
      title: Portfolio Readiness
  jira:projectPage:
    - key: portfolio-lint-project
      resource: project-page
      resolver:
        function: resolver
      render: native
      title: AI Readiness
  scheduledTrigger:
    - key: portfolio-lint-daily
      function: scheduled
      interval: day
  jira:customField:
    - key: readiness-rules
      name: Readiness
      description: Rules this issue violates in the latest Portfolio Readiness scan.
        Updated by the daily scan and by inline fixes; empty when the issue is clean.
      type: string
      collection: list
      readOnly: true
    - key: readiness-findings
      name: Readiness findings
      description: Number of Portfolio Readiness findings on this issue. Empty when
        the issue is clean.
      type: number
      readOnly: true
  jira:jqlFunction:
    - key: readiness-findings-jql
      name: readinessFindings
      function: jqlReadiness
      operators:
        - in
        - not in
      types:
        - issue
      arguments:
        - name: rule
          required: false
  consumer:
    - key: field-sync-consumer
      queue: field-sync
      function: syncFields
  rovo:agent:
    - key: portfolio-readiness-advisor
      name: Portfolio Readiness Advisor
      description: Explains how ready this Jira site is for AI forecasting and what to
        fix first.
      prompt: >
        You are the Portfolio Readiness Advisor. You help PMOs and project
        managers understand whether their Jira data is good enough for AI-driven
        schedule, capacity and scope forecasts. Always call get-portfolio-score
        before answering questions about scores, grades or what to fix. Call
        explain-rule when the user asks what a rule means or why it matters.
        Never invent scores or dates. If no report exists yet, tell the user to
        open the Portfolio Readiness page and run a scan. Present remediation as
        a short, prioritized list and say which forecast each fix improves. The
        report also carries a delivery forecast per project (p50, p85 and p95
        finish dates from a Monte Carlo on real throughput, a commitment verdict
        against the latest epic due date, the critical path and the items to
        fix first). When asked "when will X finish", quote the p85 as the date
        to commit to, the p50 as the likely date, the confidence level and its
        reasons, and how many weeks of uncertainty come from unestimated items.
        You do not change any Jira data yourself; you only read the latest
        report. Users can fix findings inline from the Findings tab of the
        Portfolio Readiness page.
      conversationStarters:
        - How ready is our portfolio for AI forecasting?
        - When will each project finish, and how sure are we?
        - What should we fix first to trust schedule forecasts?
        - Explain the stale-in-progress rule
      actions:
        - get-portfolio-score
        - explain-rule
  action:
    - key: get-portfolio-score
      name: getPortfolioScore
      function: getPortfolioScore
      actionVerb: GET
      description: >
        Latest Portfolio AI-Readiness report: score, grade, forecast
        reliability, per-project scores, remediation list and delivery forecast
        (p50/p85/p95 dates, commitment, confidence, critical path, fix-first
        items). Optional project key filter.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: false
          description: Jira project key to focus on, for example ALPHA. Leave empty for
            the whole portfolio.
    - key: explain-rule
      name: explainRule
      function: explainRule
      actionVerb: GET
      description: >
        Explains one portfolio-lint rule: what it checks, which dimension and
        forecasts it affects, why it degrades forecasting and how to remediate
        it.
      inputs:
        ruleId:
          title: Rule id
          type: string
          required: true
          description: Rule identifier such as missing-estimate or stale-in-progress.
  function:
    - key: resolver
      handler: index.handler
    - key: scheduled
      handler: index.scheduled
    - key: getPortfolioScore
      handler: index.getPortfolioScore
    - key: explainRule
      handler: index.explainRule
    - key: syncFields
      handler: index.syncFields
      timeoutSeconds: 600
    - key: jqlReadiness
      handler: index.jqlReadiness
resources:
  - key: global-page
    path: src/frontend/global-page.tsx
  - key: project-page
    path: src/frontend/project-page.tsx
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/3ea2e7ce-2801-493d-997d-3d0dfb6c023d
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
